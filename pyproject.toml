[project]
name = "docs-evals"
version = "0.1.0"
description = "Question eval and live-agent task A/B for generated documentation"
readme = "README.md"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["docs_evals*"]

[tool.setuptools.package-data]
docs_evals = ["judges/prompts/*.md"]
