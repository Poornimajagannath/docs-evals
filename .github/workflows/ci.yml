name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Question eval smoke
        run: python3 scripts/run_question_eval.py --cases tests/example_corpus/eval_cases/sample.jsonl --corpus tests/example_corpus/corpus/treatment
